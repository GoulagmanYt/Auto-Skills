name: Test and skill matrix
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      live_discovery:
        description: Run bounded real GitHub skill discovery
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m tools.check_public_tree
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_real_repositories.py
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install build twine ruff==0.17.3
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m tools.check_public_tree
      - run: python -m build --outdir dist-ci
      - run: python -m twine check dist-ci/*
      - run: python tools/check_artifacts.py dist-ci/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist-ci/*
          if-no-files-found: error
          retention-days: 14
  native-codex:
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist-ci
      - name: Install actual pinned native Codex into temporary tools directory
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/auto-skills-codex" --no-audit --no-fund @openai/codex@0.166.0
      - name: Verify wheel and sdist in separate fresh environments with native catalogs
        shell: bash
        run: |
          codex_path="$RUNNER_TEMP/auto-skills-codex/node_modules/.bin/codex"
          if [ "$RUNNER_OS" = "Windows" ]; then codex_path="$codex_path.cmd"; fi
          python tools/verify_native_install.py --codex "$codex_path" --expected-codex-version 0.166.0 --artifact dist-ci/*.whl --artifact dist-ci/*.tar.gz
          python -m pip install --no-deps dist-ci/*.whl
          python tools/verify_automatic_skills.py --codex "$codex_path" --output "$RUNNER_TEMP/automatic-skills.json" --evidence "$RUNNER_TEMP/automatic-skills-evidence"
  skill-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Deterministic matrix and regression gate
        run: python tools/simulate_repositories.py --output reports/ci-offline
      - name: Publish matrix summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/ci-offline/matrix.md ]; then
            cat reports/ci-offline/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-matrix-offline
          path: reports/ci-offline/
          if-no-files-found: error
  live-discovery:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_discovery)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/codex-auto-bootstrap/github-v1
          key: skills-github-${{ runner.os }}-${{ github.run_id }}
          restore-keys: skills-github-${{ runner.os }}-
      - name: Discover actual external skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/simulate_repositories.py --live --max-requests 240 --timeout 180 --output reports/ci-live
      - name: Publish discovery summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/ci-live/matrix.md ]; then
            cat reports/ci-live/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-matrix-real-github
          path: reports/ci-live/
          if-no-files-found: error
