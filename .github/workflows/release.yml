name: Build verified GitHub prerelease
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  prerelease:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist-ci
      - name: Confirm version tag and recheck the verified artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "tag must match package version"'
          python tools/check_artifacts.py dist-ci/*
      - name: Attach wheel and sdist to GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-ci/* --verify-tag --prerelease --generate-notes --title "Auto-Skills $RELEASE_TAG"
