[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-repo-auto-bootstrap"
version = "1.4.0a1"
description = "Autonomous repository profiling, skill selection and token tooling for Codex CLI"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
readme = "README.md"
keywords = ["codex", "agent-skills", "monorepo", "workspace", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
codex-auto-bootstrap = "codex_bootstrap.cli:main"

[project.urls]
Repository = "https://github.com/GoulagmanYt/Auto-Skills"
Issues = "https://github.com/GoulagmanYt/Auto-Skills/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_bootstrap = ["resources/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
